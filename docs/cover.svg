<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">iz</title>
  <desc id="coverDesc">A record of software people who have died, and what they left behind.</desc>

  <defs>
    <!-- The trace: solid where the person was, fading where they are not. -->
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#9A7B4F" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#9A7B4F" stop-opacity="0.85"/>
      <stop offset="0.46" stop-color="#9A7B4F" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#9A7B4F" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#F5F1E8" stop-opacity="0.16"/>
      <stop offset="0.7"  stop-color="#F5F1E8" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#F5F1E8" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm vignette, so the ink ground is not flat. -->
    <radialGradient id="ground" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0"   stop-color="#1B1815"/>
      <stop offset="1"   stop-color="#100E0C"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ground)"/>

  <!-- The mark. Heavy serif: something cut rather than typed. -->
  <text x="640" y="318"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="264" font-weight="700" letter-spacing="-6"
        text-anchor="middle" fill="#F5F1E8">iz</text>

  <!-- The trace itself, passing under the letters and continuing past them. -->
  <rect x="288" y="374" width="704" height="3" fill="url(#trace)"/>

  <text x="640" y="440"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="19" letter-spacing="7"
        text-anchor="middle" fill="#9A7B4F" opacity="0.92">TRACE</text>

  <rect x="440" y="488" width="400" height="1" fill="url(#rule)"/>

  <text x="640" y="536"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="25" text-anchor="middle" fill="#F5F1E8" opacity="0.82">
    A record of software people who have died,
  </text>
  <text x="640" y="570"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="25" text-anchor="middle" fill="#F5F1E8" opacity="0.82">
    and what they left behind.
  </text>

  <text x="640" y="614"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="14" letter-spacing="2.5"
        text-anchor="middle" fill="#F5F1E8" opacity="0.34">
    verified by people, never inferred from silence
  </text>
</svg>
