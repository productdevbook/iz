<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">iz</title>
  <desc id="coverDesc">A field of lifespans, a few of them never filled in. iz is a record of the people who built the software we use, and what they left behind.</desc>

  <defs>
    <radialGradient id="ground" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#1A1714"/>
      <stop offset="1" stop-color="#0D0B0A"/>
    </radialGradient>

    <!-- Keeps the mark from being crowded, without erasing the field. -->
    <radialGradient id="clearing" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#0D0B0A" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#0D0B0A" stop-opacity="0.80"/>
      <stop offset="1"    stop-color="#0D0B0A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0D0B0A" stop-opacity="0.85"/>
      <stop offset="0.11" stop-color="#0D0B0A" stop-opacity="0"/>
      <stop offset="0.89" stop-color="#0D0B0A" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0D0B0A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ground)"/>

  <!--
    The field. Each slot is one lifespan.

    Years are masked rather than invented. Writing plausible birth and death
    dates onto a memorial cover would mean fabricating records on a project
    whose entire premise is that records must be sourced — and invented dates
    land on real people by accident.

    The field stays lit: the weight here is the number of them, not motion.
    A few slots breathe. Three never fill at all — those are the ones nobody
    wrote down.
  -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
     font-size="19" letter-spacing="1" fill="#C9B89C" text-anchor="middle">

    <!-- row 1 -->
    <text x="130" y="70" opacity="0.30">19··—20··</text>
    <text x="320" y="70" opacity="0.24">19··—20··<animate attributeName="opacity" values="0.24;0.05;0.24" keyTimes="0;0.5;1" dur="11s" begin="1.3s" repeatCount="indefinite"/></text>
    <text x="510" y="70" opacity="0.33">19··—20··</text>
    <text x="700" y="70" opacity="0.21">19··—20··</text>
    <text x="890" y="70" opacity="0.28">19··—20··<animate attributeName="opacity" values="0.28;0.07;0.28" keyTimes="0;0.5;1" dur="14s" begin="4.7s" repeatCount="indefinite"/></text>
    <text x="1080" y="70" opacity="0.25">19··—20··</text>

    <!-- row 2 -->
    <text x="90" y="134" opacity="0.22">19··—20··</text>
    <text x="280" y="134" opacity="0.31">19··—20··</text>
    <text x="470" y="134" opacity="0.26">19··—20··<animate attributeName="opacity" values="0.26;0.06;0.26" keyTimes="0;0.5;1" dur="13s" begin="7.1s" repeatCount="indefinite"/></text>
    <text x="660" y="134" opacity="0.34">19··—20··</text>
    <text x="850" y="134" opacity="0.23">19··—20··</text>
    <text x="1040" y="134" opacity="0.29">19··—20··</text>
    <text x="1210" y="134" opacity="0.20">19··—20··</text>

    <!-- row 3 -->
    <text x="130" y="198" opacity="0.27">19··—20··</text>
    <text x="320" y="198" opacity="0.35">19··—20··</text>
    <!-- never filled: nobody recorded it -->
    <text x="510" y="198" opacity="0.06">19··—20··</text>
    <text x="700" y="198" opacity="0.24">19··—20··<animate attributeName="opacity" values="0.24;0.05;0.24" keyTimes="0;0.5;1" dur="15s" begin="2.2s" repeatCount="indefinite"/></text>
    <text x="890" y="198" opacity="0.30">19··—20··</text>
    <text x="1080" y="198" opacity="0.22">19··—20··</text>

    <!-- row 4 — the mark sits here; only the far flanks are occupied -->
    <text x="90" y="272" opacity="0.25">19··—20··</text>
    <text x="272" y="272" opacity="0.32">19··—20··</text>
    <text x="1008" y="272" opacity="0.28">19··—20··<animate attributeName="opacity" values="0.28;0.08;0.28" keyTimes="0;0.5;1" dur="12s" begin="5.9s" repeatCount="indefinite"/></text>
    <text x="1190" y="272" opacity="0.21">19··—20··</text>

    <!-- row 5 — the mark sits here -->
    <text x="130" y="346" opacity="0.29">19··—20··</text>
    <!-- never filled -->
    <text x="312" y="346" opacity="0.06">19··—20··</text>
    <text x="968" y="346" opacity="0.33">19··—20··</text>
    <text x="1150" y="346" opacity="0.23">19··—20··</text>

    <!-- row 6 -->
    <text x="90" y="420" opacity="0.24">19··—20··</text>
    <text x="272" y="420" opacity="0.30">19··—20··</text>
    <text x="1008" y="420" opacity="0.26">19··—20··</text>
    <text x="1190" y="420" opacity="0.31">19··—20··<animate attributeName="opacity" values="0.31;0.09;0.31" keyTimes="0;0.5;1" dur="16s" begin="9.4s" repeatCount="indefinite"/></text>

    <!-- row 7 -->
    <text x="130" y="504" opacity="0.28">19··—20··</text>
    <text x="320" y="504" opacity="0.22">19··—20··</text>
    <text x="510" y="504" opacity="0.31">19··—20··</text>
    <text x="700" y="504" opacity="0.25">19··—20··<animate attributeName="opacity" values="0.25;0.06;0.25" keyTimes="0;0.5;1" dur="13s" begin="3.4s" repeatCount="indefinite"/></text>
    <!-- never filled -->
    <text x="890" y="504" opacity="0.06">19··—20··</text>
    <text x="1080" y="504" opacity="0.27">19··—20··</text>

    <!-- row 8 -->
    <text x="90" y="568" opacity="0.23">19··—20··</text>
    <text x="280" y="568" opacity="0.29">19··—20··</text>
    <text x="470" y="568" opacity="0.21">19··—20··</text>
    <text x="660" y="568" opacity="0.32">19··—20··</text>
    <text x="850" y="568" opacity="0.24">19··—20··<animate attributeName="opacity" values="0.24;0.05;0.24" keyTimes="0;0.5;1" dur="14s" begin="6.6s" repeatCount="indefinite"/></text>
    <text x="1040" y="568" opacity="0.30">19··—20··</text>
    <text x="1210" y="568" opacity="0.19">19··—20··</text>

    <!-- row 9 -->
    <text x="130" y="622" opacity="0.20">19··—20··</text>
    <text x="510" y="622" opacity="0.24">19··—20··</text>
    <text x="890" y="622" opacity="0.22">19··—20··</text>
  </g>

  <ellipse cx="640" cy="318" rx="352" ry="158" fill="url(#clearing)"/>
  <rect width="1280" height="640" fill="url(#vignette)"/>

  <!-- The mark. -->
  <text x="640" y="308"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="146" font-weight="700" letter-spacing="-3"
        text-anchor="middle" fill="#F5F1E8">iz</text>

  <text x="640" y="358"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="14" letter-spacing="6"
        text-anchor="middle" fill="#9A7B4F" opacity="0.9">TRACE</text>

  <text x="640" y="412"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="25" text-anchor="middle" fill="#F5F1E8" opacity="0.9">
    The code is still running.
  </text>
  <text x="640" y="446"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="25" text-anchor="middle" fill="#F5F1E8" opacity="0.55">
    The people who wrote it are not.
  </text>
</svg>
