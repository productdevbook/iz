id: near
name: Near
also_known_as:
  - byuu

died: "2021-06-27"

summary: >-
  Spent seventeen years building the most accurate Super Nintendo emulator
  anyone had made, on the argument that "close enough" quietly loses things —
  timing, edge cases, the exact behaviour a game depended on. bsnes was the
  first SNES emulator to reach full compatibility, and the preservation work
  around it, including decapping cartridge chips to read what was actually on
  them, outlives the emulators themselves.

work:
  - name: bsnes
    role: creator
    url: https://github.com/bsnes-emu/bsnes
    note: >-
      Begun in 2004. The first Super Nintendo emulator to reach complete
      compatibility, written for accuracy over speed at a time when that
      tradeoff was unfashionable.
  - name: higan
    role: creator
    note: >-
      A multi-system emulator built on the same principles, covering the NES,
      SNES, Game Boy line, Sega systems, PC Engine and more.
  - name: Hardware preservation
    role: contributor
    note: >-
      Documented and dumped cartridge coprocessors, including work that
      required decapping chips, so the behaviour could be reproduced rather
      than approximated.
  - name: Bahamut Lagoon translation
    role: translator
    note: A retranslation of the 1996 Square title, finished shortly before their death.

