id: jennell-jaquays
name: Jennell Jaquays

born: "1956-10-14"
died: "2024-01-10"

summary: >-
  Designed dungeons so well that designers now use her name as a verb. Dark
  Tower and Caverns of Thracia rejected the corridor-and-room march in favour of
  loops, verticality and choices that could be approached from any direction —
  the idea that a space should be explored rather than traversed. She carried
  the same instinct into level design at id Software on Quake II and Quake III
  Arena.

work:
  - name: Caverns of Thracia
    role: designer
    note: >-
      A 1979 Judges Guild module, still cited as a model of non-linear dungeon
      design.
  - name: Dark Tower
    role: designer
    note: Published by Judges Guild in 1980.
  - name: The Dungeoneer
    role: co-founder
    note: One of the earliest Dungeons & Dragons fanzines, started in 1977.
  - name: Quake II and Quake III Arena
    role: level designer
    note: At id Software.
  - name: Age of Empires III
    role: contributor
  - name: Halo Wars
    role: contributor
  - name: Coleco home arcade conversions
    role: designer
    note: Including versions of Pac-Man and Donkey Kong.
  - name: Olde Sküül
    role: co-founder
    note: Founded in 2013, with Rebecca Heineman.

