    role: co-founder
    note: >-
      Founded in 1983 with Brian Fargo, Jay Patel and Troy Worrell, at the age
      of twenty.
  - name: "The Bard's Tale III: Thief of Fate"
    role: designer and programmer
    note: Released in 1988.
  - name: Out of This World
    role: programmer
    note: >-
      The 3DO and console conversions, work she was known for well beyond this
      one title.
  - name: Wolfenstein 3D
    role: programmer
    note: The Macintosh port.
  - name: Contraband Entertainment
    role: founder
    note: Founded in 1999.
  - name: Olde Sküül
    role: co-founder and chief executive
    note: Founded in 2013, with Jennell Jaquays.

