id: rebecca-heineman
name: Rebecca Heineman
also_known_as:
  - Burger Becky

born: "1963"
died: "2025-11-17"

summary: >-
  Won the first national videogame tournament held in the United States in 1980,
  then spent forty-five years building the games themselves — co-founding
  Interplay at twenty, designing The Bard's Tale III, and writing the ports that
  brought Wolfenstein 3D, Baldur's Gate and Out of This World to platforms their
  authors had not targeted. She was credited on sixty-seven games, and she was
  one of the most visible transgender people in her industry.

work:
