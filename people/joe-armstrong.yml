id: joe-armstrong
name: Joe Armstrong
also_known_as:
  - joeerl

born: "1950-12-27"
died: "2019-04-20"

summary: >-
  Co-created Erlang at Ericsson in 1986 to make telephone exchanges that could
  not be allowed to stop. The result was a way of building systems that survive
  their own failures — let it crash, then recover — and it now runs underneath
  a great deal of messaging, telecoms and banking infrastructure. He spent his
  later years explaining it to anyone who would listen.

work:
  - name: Erlang
    role: co-creator
    url: https://www.erlang.org
    note: >-
      Designed with Robert Virding and Mike Williams at the Ericsson Computer
      Science Laboratory. Released as open source in 1998.
  - name: OTP
    role: contributor
    note: >-
      The libraries and supervision trees that turned Erlang's ideas about
      failure into something teams could build on.
  - name: Programming Erlang
    role: author
    note: The book most people learned the language from.
  - name: "Making reliable distributed systems in the presence of software errors"
    role: author
    note: His 2003 doctoral thesis, still widely read.

