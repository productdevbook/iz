id: bram-moolenaar
name: Bram Moolenaar

born: "1961"
died: "2023-08-03"

summary: >-
  Created and maintained Vim for over thirty years, shipping it as charityware
  that directed its sponsorship income to AIDS orphans in Uganda. Vim became the
  default editor on most Linux distributions, which puts his code on more
  machines than almost any program outside the kernel itself.

work:
  - name: Vim
    role: creator and maintainer
    url: https://www.vim.org
    note: >-
      Began as an Amiga clone of vi in 1988, first released publicly in 1991,
      and maintained by him until his death.
  - name: International Child Care Fund Holland
    role: founder
    note: >-
      Founded in 1995. Vim has asked its users to donate to it ever since,
      which is what "charityware" meant to him.
  - name: A-A-P
    role: creator
    note: A build and software distribution tool.
  - name: Zimbu
    role: creator
    note: An experimental programming language.

